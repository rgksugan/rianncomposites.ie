<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c1a33">
<meta name="robots" content="index, follow">

{% if page.title %}
  <title>{{ page.title }} | {{ site.title }}</title>
{% else %}
  <title>{{ site.title }} — {{ site.tagline }}</title>
{% endif %}

<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta name="author" content="Riann Composites">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<!-- Open Graph -->
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/images/riann-logo.jpeg' | absolute_url }}">
<meta property="og:image:alt" content="Riann Composites – Fibreglass, Carbon Fibre &amp; Plastic Panel Repair">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:locale" content="en_IE">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description | strip_newlines }}">
<meta name="twitter:image" content="{{ '/assets/images/riann-logo.jpeg' | absolute_url }}">
<meta name="twitter:image:alt" content="Riann Composites – Fibreglass, Carbon Fibre &amp; Plastic Panel Repair">

<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
